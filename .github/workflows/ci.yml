name: FE CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: FE lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # pnpm을 먼저 설치해야 setup-node가 pnpm 캐시를 쓸 수 있음
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # lock 파일과 package.json이 안 맞으면 실패 (의존성 추가 후 lock 커밋 누락 방지)
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # vite build + tsc -b (타입 오류도 여기서 걸림)
      - run: pnpm build
